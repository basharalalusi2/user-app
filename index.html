<!DOCTYPE html>

        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700&display=swap');
        
        body { background-color: #3b0066; color: #ffffff; font-family: 'Tajawal', sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .container { width: 92%; max-width: 420px; background-color: #ffffff; color: #333; padding: 30px 20px; border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.4); text-align: center; box-sizing: border-box; }
        
        h2 { color: #5a189a; margin-bottom: 5px; font-size: 20px; }
        p.subtitle { color: #666; font-size: 13px; margin-bottom: 20px; }
        
        /* تبديل الأدوار (مشترك / مدير) */
        .role-switch { display: flex; background-color: #f1f1f1; border-radius: 10px; padding: 4px; margin-bottom: 20px; }
        .role-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: #555; font-size: 15px; font-weight: bold; font-family: 'Tajawal', sans-serif; cursor: pointer; transition: 0.3s; }

        input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 10px; background-color: #f9f9f9; color: #333; font-size: 15px; font-family: 'Tajawal', sans-serif; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus { border-color: #7b2cbf; background-color: #fff; }

        .btn-submit { width: 100%; padding: 13px; background-color: #7b2cbf; color: white; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; font-family: 'Tajawal', sans-serif; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        .btn-submit:hover { background-color: #5a189a; }
        
        #messageBox { margin-top: 15px; font-weight: bold; font-size: 14px; display: none; }

        /* لوحة تحكم الإدارة */
        .admin-full-box { display: none; width: 95%; max-width: 900px; background-color: #4d0085; padding: 25px 15px; border-radius: 15px; margin-top: 20px; box-sizing: border-box; }

        .dash-card { flex: 1 1 150px; padding: 20px 10px; border-radius: 8px; text-align: center; color: white; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .dash-card h4 { margin: 0 0 10px 0; font-size: 13px; opacity: 0.9; }
        .dash-card p { margin: 0; font-size: 22px; }
        .card-total { background-color: #43649e; }
        .card-active { background-color: #49b56d; }
        .card-expiring { background-color: #f1b31c; }
        .card-expired { background-color: #e5625c; }
        .card-debt { background-color: #4e65a5; }

        .table-container { overflow-x: auto; border-radius: 8px; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background-color: #ffffff; color: #333; font-size: 14px; text-align: center; white-space: nowrap; }
        th, td { padding: 10px; border: 1px solid #ddd; }
        th { background-color: #8c2ee0; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        .btn-action { padding: 5px 10px; font-size: 13px; margin: 2px; border-radius: 4px; border: none; cursor: pointer; color: white; }
        .btn-edit { background-color: #ffc107; color: black; }
        .btn-wa { background-color: #25d366; }
        .btn-del { background-color: #dc3545; }

        .store-title { text-align: center; color: #00ff88; margin-bottom: 15px; font-size: 18px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .product-card { background-color: rgba(0,0,0,0.3); border-radius: 10px; padding: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.15); }
        .product-icon { font-size: 35px; margin-bottom: 8px; }
        .product-card h3 { font-size: 15px; margin: 5px 0; color: #ffd700; }
        .product-card p { font-size: 12px; margin: 4px 0; color: #ddd; }
        .product-price { font-weight: bold; color: #00ff88; font-size: 14px; margin: 6px 0; }
        .btn-buy { background-color: #25d366; color: white; padding: 8px; border-radius: 5px; font-size: 13px; text-decoration: none; font-weight: bold; display: block; margin-top: 6px; }
