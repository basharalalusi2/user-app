<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بشار الالوسي لخدمات الانترنت</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #3b0066; color: #fff; font-family: Tahoma, sans-serif; text-align: center; padding: 50px; }
        .box { background: #4d0085; padding: 30px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; box-sizing: border-box; }
        input { background: #fff; color: #333; }
        button { background: #8c2ee0; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>بشار الالوسي<br>لخدمات الانترنت والاتصالات</h2>
        <input type="text" id="u" placeholder="اليوزر">
        <input type="password" id="p" placeholder="الباسورد">
        <button onclick="go()">دخول</button>
        <p id="msg" style="color:#ffd700;"></p>
    </div>
    <script>
        const cfg = { apiKey: "AIsyCFV84WqJdfhmBWbn2KUNxOUwXTAERNHHE", authDomain: "start-in-production.firebaseapp.com", projectId: "start-in-production", storageBucket: "start-in-production.firebasestorage.app", messagingSenderId: "929663491292", appId: "1:929663491292:web:46beb745d3dedc789ae819" };
        firebase.initializeApp(cfg);
        const db = firebase.firestore();
        async function go() {
            let u = document.getElementById('u').value.trim();
            let p = document.getElementById('p').value.trim();
            let m = document.getElementById('msg');
            if(u === 'bashar@dsc' && p === 'bashar2000') {
                m.innerText = "تم تسجيل دخول المدير بنجاح!";
                return;
            }
            m.innerText = "جاري التحقق...";
            try {
                let snap = await db.collection('subscribers').where('username', '==', u).get();
                let found = false;
                snap.forEach(d => { if(String(d.data().password) === String(p)) found = true; });
                if(found) { m.innerText = "أهلاً بك، تسجيل دخول صحيح!"; }
                else { m.innerText = "خطأ في اليوزر أو الباسورد"; }
            } catch(e) { m.innerText = "خطأ في الاتصال بالسحابة"; }
        }
    </script>
</body>
</html>
